<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talent Passport</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar"><a class="logo" href="/" style="color:inherit;text-decoration:none">திறன் <small>Thiran · Talent Passport</small></a></header>
  <main id="pp"><p class="muted">Loading…</p></main>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const slug = location.pathname.split('/').filter(Boolean).pop();
    const icon = (c) => c.startsWith('endorse') ? '👩‍🏫' : c.startsWith('step') ? '✅' : c.startsWith('selected') ? '🏆' : c.startsWith('career') ? '⭐' : c.startsWith('module') ? '📚' : '🏅';
    fetch('/api/v1/passport/' + encodeURIComponent(slug)).then((r) => r.ok ? r.json() : Promise.reject(r.status)).then((d) => {
      const initials = (d.name || '?').split(' ').map((x) => x[0]).join('').slice(0, 2);
      document.title = d.name + ' · Talent Passport';
      document.getElementById('pp').innerHTML = `
        <div class="card"><div class="passport-head"><div class="avatar">${esc(initials)}</div>
          <div class="grow"><h1 style="margin:0">${esc(d.name)}</h1>
          <p class="muted small">📍 ${esc([d.district, d.state].filter(Boolean).join(', '))}${d.teacher ? ' · 👩‍🏫 Teacher: ' + esc(d.teacher) : ''}</p>
          ${d.goal ? `<span class="pill good">⭐ Goal: ${esc(d.goal.en)}</span>` : ''}</div></div>
          <div class="stats" style="margin-top:12px">
            <div class="stat"><b>${d.stats.endorsements}</b><span>Teacher endorsements</span></div>
            <div class="stat"><b>${d.stats.badges}</b><span>Badges</span></div>
            <div class="stat"><b>${d.stats.steps_done}</b><span>Pathway steps done</span></div></div></div>
        ${d.endorsements.length ? '<h2>👩‍🏫 Endorsed skills</h2>' + d.endorsements.map((e) => `<div class="card"><b>✔️ ${esc(e.skill)}</b><p class="small">“${esc(e.note)}”</p><p class="small muted">${esc(e.by)} · Teacher · ${esc(e.date)}</p></div>`).join('') : ''}
        <h2>🏅 Badges</h2><div class="card badge-list">${d.badges.map((b) => `<div class="badge"><span class="b-ic">${icon(b.code)}</span><div><b>${esc(b.title)}</b><div class="small muted">${esc(b.detail || '')} · ${esc(b.date)}</div></div></div>`).join('')}</div>
        <div class="card" style="margin-top:12px"><p class="small">🔒 Contact details are private. Employers registered on Thiran can request contact through the student's teacher.</p></div>`;
    }).catch(() => { document.getElementById('pp').innerHTML = '<div class="card"><h2>Passport not found</h2></div>'; });
  </script>
</body>
</html>
